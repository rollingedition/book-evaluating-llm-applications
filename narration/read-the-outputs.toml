# Chapter read-the-outputs's narration (re-check narration): descriptions of its examples, blocks and tables, as
# [examples.ID], [[blocks]] and [[tables]], and its own readings. Only this chapter's writer edits this file, so
# writers working in parallel never append to one shared lexicon. A reading every chapter needs goes into
# narration/lexicon.toml, which wins over a chapter's.

[examples.read-replies-dev]
say = "The code takes the dev items in order of kind, answerable first, and prints each item's ID, version and question. Under each item it prints the reference answer, then one line per variant: whether the reply declined, what it cited, and the start of its text. A reply that holds the decline phrase inside other text is marked as a phrase, not a decline. Read the lines of an item together to see how the variants differ on the same question."

[examples.tally-failure-modes]
say = "The code checks the codes against the dev items and the list of modes, so that each reply is counted once. It then prints a table with a row for each mode, the ok row first, and a column for each variant, with a total for each variant, and one labelled line for each count. The label on the counts says the codes were made by the drafting model, as one coder, and are not human labels."

