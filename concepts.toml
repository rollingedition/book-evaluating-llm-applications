definition = "The transfer assumption is that the judge's miss rate on human passes, and its pass-through rate on human fails, are the same on sablefile's replies as on the HelpSteer2 rows."
section = "transfer-assumption"

[[concepts]]
id = "pairwise-judge"
term = "pairwise judge"
context = "llm-evaluation"
definition = "A pairwise judge reads two replies and picks the better one, rather than passing or failing each."
section = "pairwise-calibration"
example = "pairwise-agreement"

[[concepts]]
id = "position"
term = "position"
context = "llm-evaluation"
definition = "position: whether a pairwise verdict depends on which answer was shown first."
section = "when-the-judge-stops-being-reliable"

[[concepts]]
id = "length"
term = "length"
aliases = ["verbosity bias"]
context = "llm-evaluation"
definition = "length: whether the pass rate rises with the length of the reply."
section = "when-the-judge-stops-being-reliable"

[concepts.relations]
contrasts-with = ["position"]

[[concepts]]
id = "self-preference"
term = "self-preference"
context = "llm-evaluation"
definition = "self-preference: whether the judge favours answers written by its own model."
section = "when-the-judge-stops-being-reliable"

[concepts.relations]
contrasts-with = ["length"]

[[concepts]]
id = "unreadable-pair"
term = "unreadable pair"
context = "llm-evaluation"
definition = "An unreadable pair has a missing verdict in either order."
