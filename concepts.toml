computed-from = ["outcome", "path"]

[[concepts]]
id = "grounded"
term = "grounded"
context = "retrieval-augmented-generation"
definition = "An answer is grounded when a reader who follows its citations finds the claim where the citation says it is, in the version they asked about."
section = "what-grounded-means"

[[concepts]]
id = "citation"
term = "citation"
context = "retrieval-augmented-generation"
definition = "A citation is a claim about the docs: this section, in this version, supports the sentence it is attached to."
section = "citation-accuracy"
example = "citation-accuracy-counts"

[[concepts]]
id = "citation-rate"
term = "citation rate"
context = "retrieval-augmented-generation"
definition = "The citation rate counts every citation in answered items that is supported."
section = "citation-accuracy"
example = "citation-accuracy-counts"

[concepts.relations]
contrasts-with = ["item-rate"]

[[concepts]]
id = "item-rate"
term = "item rate"
context = "retrieval-augmented-generation"
definition = "The item rate counts an answered item once if at least one of its citations is supported, so one good citation carries the item."
section = "citation-accuracy"
example = "citation-accuracy-counts"

[[concepts]]
id = "judged-correct-rate"
term = "judged-correct rate"
context = "llm-evaluation"
definition = "The judged-correct rate is the count for version-dependent items alone, so a version miss shows on its own line, and a team can see whether a change to retrieval moved it."
