example = "flip-rate"

[[concepts]]
id = "flip"
term = "flip"
aliases = ["flips", "flaky"]
context = "llm-evaluation"
definition = "An item flips when its five verdicts are not all the same."
section = "variance-within-one-item"
example = "flip-rate"

[[concepts]]
id = "unpaired-comparison"
term = "unpaired comparison"
definition = "An unpaired comparison takes two separate pass rates and sets them side by side."
section = "paired-comparisons"

[[concepts]]
id = "no-difference-detected"
term = "no difference detected"
definition = "No difference detected is a finding about a set at its size."
section = "paired-comparisons"
example = "paired-prompt-b"

[[concepts]]
id = "k5"
term = "k5"
