[concepts.relations]
contrasts-with = ["faithfulness"]

[[concepts]]
id = "faithfulness"
term = "faithfulness"
context = "retrieval-augmented-generation"
definition = "Faithfulness asks whether each claim is in the sections the assistant was shown."
section = "grounded-answers"

[concepts.relations]
contrasts-with = ["version-correctness"]

[[concepts]]
id = "version-correctness"
term = "version-correctness"
context = "retrieval-augmented-generation"
definition = "Version-correctness asks whether the answer fits the asked version."
section = "grounded-answers"

[[concepts]]
id = "outcome-against-path"
term = "outcome against path"
context = "llm-evaluation"
definition = "Outcome against path asks whether a pass came with its section in hand, and whether a fail had it."
section = "grounded-answers"

