example = "version-correct-answers"

[[concepts]]
id = "outcome"
term = "outcome"
context = "llm-evaluation"
definition = "Outcome is whether a reply passed."
section = "outcome-and-path"

[concepts.relations]
contrasts-with = ["path"]

[[concepts]]
id = "path"
term = "path"
context = "llm-evaluation"
definition = "Path is what the steps before the reply reached."
section = "outcome-and-path"

[[concepts]]
id = "retrieval-path-count"
term = "retrieval-path count"
context = "retrieval-augmented-generation"
definition = "The retrieval-path count asks one question of each item: is a supporting section of the asked version in the top k?"
section = "retrieval-quality"

[[concepts]]
id = "false-refusal-rate"
term = "false refusal rate"
